[tool.poetry]
name = "shynet"
version = "0.13.1"
description = "Modern, privacy-friendly, and cookie-free web analytics."
authors = ["R. Miles McCain <github@sendmiles.email>"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.12"
Django = "*"
django-allauth = "*"
geoip2 = "*"
whitenoise = "*"
celery = "*"
django-ipware = "*"
PyYAML = "*"
user-agents = "*"
rules = "*"
gunicorn = "*"
psycopg2-binary = "*"
redis = "*"
pycountry = "*"
html2text = "*"
django-health-check = "*"
django-npm = "*"
python-dotenv = "*"
django-debug-toolbar = "*"
django-cors-headers = "*"

[tool.poetry.group.dev.dependencies]
pytest-sugar = "*"
factory-boy = "*"
pytest-django = "*"
django-coverage-plugin = "*"
django-stubs = "*"
mypy = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
